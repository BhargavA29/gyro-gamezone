<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/icon-pad.svg" />
    <title>Gyro-Gamezone Play</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
  </head>
  <body>
    <main style="max-inline-size: 620px; margin: 4rem auto; padding: 1.5rem; display: grid; gap: 1rem;">
      <section class="panel" style="display: grid; gap: 1rem;">
        <h1>Gyro-Gamezone Play</h1>
        <p style="color: var(--text-secondary);">Choose your screen role on this device.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 0.75rem;">
          <a class="btn btn-primary" href="/host">Open Desktop Host (/host)</a>
          <a class="btn btn-accent" href="/pad">Open Phone Controller (/pad)</a>
          <a class="btn btn-ghost" href="/pad/debug">Open Sensor Lab (/pad/debug)</a>
        </div>
      </section>
    </main>
  </body>
</html>
