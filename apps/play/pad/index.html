<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Gyro-Gamezone motion phone controller. Pair via room code and play on the big screen." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GyroPad" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Join Gyro-Gamezone on Your Phone" />
    <meta property="og:description" content="Pair your phone controller and enter the arcade arena." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="manifest" href="/pad-manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Gyro-Gamezone Pad</title>
    <script>
      try {
        var s = localStorage.getItem("gyro-color-scheme");
        if (s === "light" || s === "dark" || s === "light dark") {
          document.querySelector('meta[name="color-scheme"]').content = s;
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc && (s === "light" || s === "dark")) {
            tc.content = s === "light" ? "#f3f5f8" : "#0d0f14";
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/pad/main.ts"></script>
  </body>
</html>
