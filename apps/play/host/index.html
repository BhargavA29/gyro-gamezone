<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/icon-pad.svg" />
    <title>Host Screen — Gyro-Gamezone</title>
    <script>
      try {
        var s = localStorage.getItem("gyro-color-scheme");
        if (s === "light" || s === "dark" || s === "light dark") {
          document.querySelector('meta[name="color-scheme"]').content = s;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/host/main.ts"></script>
  </body>
</html>
