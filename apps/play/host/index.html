<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Gyro-Gamezone shared desktop game arena. Create a room and pair 1–4 phones via QR code." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="apple-mobile-web-app-title" content="Gyro-Gamezone Host" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gyro-Gamezone Host Screen" />
    <meta property="og:description" content="Open a room code & QR code to let friends join on their phones." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Host Screen — Gyro-Gamezone</title>
    <script>
      try {
        var s = localStorage.getItem("gyro-color-scheme");
        if (s === "light" || s === "dark" || s === "light dark") {
          document.querySelector('meta[name="color-scheme"]').content = s;
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc && (s === "light" || s === "dark")) {
            tc.content = s === "light" ? "#f3f5f8" : "#0d0f14";
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/host/main.ts"></script>
  </body>
</html>
